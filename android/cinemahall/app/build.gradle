plugins { id 'com.android.application' }

android {
    namespace 'app.cinemahall.nativeui'
    compileSdk 36

    defaultConfig {
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
    flavorDimensions 'screen'
    productFlavors {
        tv { dimension 'screen'; applicationId 'app.cinemahall.next.tv' }
        mobile { dimension 'screen'; applicationId 'app.cinemahall.next.mobile' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        jniLibs { useLegacyPackaging true; keepDebugSymbols += ['**/libtorrserver.so'] }
    }
}
dependencies { implementation project(':provider') }
