name: Streamflix Shell Trial

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/streamflix'
      - '.gitmodules'
      - '.github/workflows/streamflix-shell-trial.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK + NDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;26.1.10909125' 'cmake;3.22.1'
      - name: Use native TV and mobile layouts
        working-directory: android/streamflix
        run: |
          printf '%s\n' 'APP_LAYOUT=auto' 'TMDB_API_KEY=' 'SUBDL_API_KEY=' 'RABBITSTREAM_SOURCE_API=' > local.properties
      - name: Build trial APK
        working-directory: android/streamflix
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Streamflix-shell-trial
          path: android/streamflix/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
