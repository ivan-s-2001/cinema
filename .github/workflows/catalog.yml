name: Catalogue index

on:
  pull_request:
  workflow_dispatch:
    inputs:
      pages:
        description: Popular catalogue pages per type (100 titles each)
        required: false
        default: '3'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_catalog_builder.py'

  snapshot:
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build metadata index
        env:
          KINOAPI_KEY: ${{ secrets.KINOAPI_KEY }}
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          PAGES: ${{ inputs.pages }}
        run: python scripts/build_catalog.py --pages "$PAGES" --enrich 30 --details 12 --season-limit 3 --output catalog/index.json
      - uses: actions/upload-artifact@v4
        with:
          name: cinemahall-catalog
          path: catalog/index.json
          retention-days: 14
