name: Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify source selection, episode and seek logic
        run: |
          mkdir -p build/check
          javac -d build/check app/src/main/java/app/cinemahall/tv/Logic.java tests/LogicCheck.java
          java -cp build/check app.cinemahall.tv.LogicCheck
      - name: Fetch pinned streaming engine
        run: python3 scripts/fetch_engine.py
      - name: Build and lint
        run: ./gradlew :app:assembleDebug :app:lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: CinemaHall-debug
          path: app/build/outputs/apk/debug/*.apk
