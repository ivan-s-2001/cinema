name: Android Preview APK
on:
  push:
    branches: [rewrite/streambert-android]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: python3 scripts/fetch_engine.py
      - run: gradle -p android/core :app:assembleDebug :app:lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: CinemaHall-Preview-TV-Mobile
          path: android/core/app/build/outputs/apk/debug/*.apk
