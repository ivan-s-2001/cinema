name: Android TV + Mobile APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare pinned TV + mobile application
        run: python3 scripts/prepare_android.py
      - name: Fetch verified embedded engine
        run: python3 scripts/fetch_engine.py
      - name: Build TV + mobile APK
        working-directory: android/arvio
        run: ./gradlew :app:assembleSideloadDebug --no-daemon
      - name: Check CinemaHall quality tabs and catalog contract
        working-directory: android/arvio
        run: ./gradlew :app:testSideloadDebugUnitTest --tests app.cinemahall.tv.CinemaQualityTabsTest --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: CinemaHall-TV-Mobile-debug
          path: android/arvio/app/build/outputs/apk/sideload/debug/*.apk
