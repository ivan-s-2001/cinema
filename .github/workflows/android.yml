name: CinemaHall Android TV
on:
  push:
    branches: [main, feat/cinemahall-nuvio-quality-voice]
  pull_request:
  workflow_dispatch:
concurrency:
  group: cinemahall-nuvio-${{ github.sha }}-${{ github.event_name }}
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  verify-tv:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - run: python3 scripts/prepare_nuvio.py --target tv
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: python3 scripts/check_provider.py
      - name: Compile and test TV
        working-directory: android/nuvio-tv
        run: bash ./gradlew :app:compileFullDebugKotlin :app:testFullDebugUnitTest --tests "com.nuvio.tv.ui.screens.stream.CinemaQualityTest" --tests "com.nuvio.tv.ui.screens.settings.SettingsCatalogTest" --tests "com.nuvio.tv.ui.util.HeroMetadataFormatterTest" --no-daemon --max-workers=2
  catalogue:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.snapshot.outputs.available || steps.fallback.outputs.available }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_catalog_builder.py'
      - id: snapshot
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          KINOAPI_KEY: ${{ secrets.KINOAPI_KEY }}
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
        run: |
          if [ -n "$KINOAPI_KEY" ]; then
            if python scripts/build_catalog.py --pages 15 --enrich 30 --details 80 --season-limit 5 --output catalog/index.json; then
              echo "available=true" >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: actions/download-artifact@v4
        id: cached-catalogue
        continue-on-error: true
        if: steps.snapshot.outputs.available != 'true'
        with:
          name: CinemaHall-bundled-catalogue
          run-id: 40549883418
          github-token: ${{ github.token }}
          path: catalog/
      - id: fallback
        if: steps.snapshot.outputs.available != 'true'
        run: |
          if [ -s catalog/index.json ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "Cached catalogue unavailable; building with live catalogue fallback."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        if: steps.snapshot.outputs.available == 'true' || steps.fallback.outputs.available == 'true'
        with:
          name: CinemaHall-bundled-catalogue
          path: catalog/
  build:
    needs: catalogue
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [tv]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - run: python3 scripts/prepare_nuvio.py --target '${{ matrix.target }}'
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - if: matrix.target == 'mobile'
        run: sdkmanager "platforms;android-37.1"
      - run: python3 scripts/check_provider.py
      - run: python3 scripts/fetch_engine.py
      - uses: actions/download-artifact@v4
        if: needs.catalogue.outputs.available == 'true'
        with:
          name: CinemaHall-bundled-catalogue
          path: android/core/app/src/main/assets/catalog/
      - name: Build CinemaHall TV APK with catalogue
        shell: bash
        run: |
          if [ '${{ matrix.target }}' = 'tv' ]; then
            cd android/nuvio-tv
            bash ./gradlew :app:assembleFullDebug :app:testFullDebugUnitTest --tests "com.nuvio.tv.ui.screens.stream.CinemaQualityTest" --tests "com.nuvio.tv.ui.screens.settings.SettingsCatalogTest" --tests "com.nuvio.tv.ui.util.HeroMetadataFormatterTest" --no-daemon --max-workers=2
          else
            cd android/nuvio-mobile
            bash ./gradlew :androidApp:assembleFullDebug --no-daemon --max-workers=2
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: CinemaHall-TV
          path: android/nuvio-tv/app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
