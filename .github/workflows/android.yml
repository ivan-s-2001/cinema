name: CinemaHall Nuvio TV and Mobile
on:
  push:
    branches: [rewrite/streambert-android, feat/cinemahall-nuvio-quality-voice]
  pull_request:
  workflow_dispatch:
concurrency:
  group: cinemahall-nuvio-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  catalogue:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.snapshot.outputs.available }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_catalog_builder.py'
      - id: snapshot
        env:
          KINOAPI_KEY: ${{ secrets.KINOAPI_KEY }}
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
        run: |
          if [ -n "$KINOAPI_KEY" ]; then
            python scripts/build_catalog.py --pages 15 --enrich 30 --details 12 --output catalog/index.json
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        if: steps.snapshot.outputs.available == 'true'
        with:
          name: CinemaHall-bundled-catalogue
          path: catalog/
  build:
    needs: catalogue
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [tv]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - run: python3 scripts/prepare_nuvio.py --target '${{ matrix.target }}'
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - if: matrix.target == 'mobile'
        run: sdkmanager "platforms;android-37.1"
      - run: python3 scripts/check_provider.py
      - run: python3 scripts/fetch_engine.py
      - uses: actions/download-artifact@v4
        if: needs.catalogue.outputs.available == 'true'
        with:
          name: CinemaHall-bundled-catalogue
          path: android/core/app/src/main/assets/catalog/
      - name: Build full upstream interface with our provider
        shell: bash
        run: |
          if [ '${{ matrix.target }}' = 'tv' ]; then
            cd android/nuvio-tv
            ./gradlew :app:assembleFullDebug --no-daemon --max-workers=2
          else
            cd android/nuvio-mobile
            ./gradlew :androidApp:assembleFullDebug --no-daemon --max-workers=2
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: CinemaHall-Nuvio-${{ matrix.target }}
          path: android/nuvio-*/**/build/outputs/apk/full/debug/*.apk
