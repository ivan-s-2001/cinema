name: Vendor complete Nuvio sources
on:
  push:
    branches: [feat/cinemahall-nuvio-quality-voice]
    paths:
      - 'scripts/vendor_nuvio.sh'
      - '.github/workflows/vendor-nuvio.yml'
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
          persist-credentials: true
      - name: Copy full upstream trees into CinemaHall
        run: bash scripts/vendor_nuvio.sh
      - name: Commit vendored sources to the migration branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Vendor complete Nuvio TV and Mobile source trees"
          git push origin HEAD:feat/cinemahall-nuvio-quality-voice
