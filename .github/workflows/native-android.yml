name: CinemaHall Next · independent Android
on:
  push:
    branches: [rewrite/native-cinemahall]
  pull_request:
    paths:
      - 'android/cinemahall/**'
      - 'android/provider/**'
      - 'android/core/**'
      - '.github/workflows/native-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'rewrite/native-cinemahall'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: python3 scripts/fetch_engine.py
      - name: Bundle CinemaHall catalogue when configured
        env:
          KINOAPI_KEY: ${{ secrets.KINOAPI_KEY }}
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
        run: |
          if [ -n "$KINOAPI_KEY" ]; then
            python3 scripts/build_catalog.py --pages 15 --enrich 30 --details 12 --output android/core/app/src/main/assets/catalog/index.json
          fi
      - run: gradle -p android/cinemahall :app:assembleTvDebug :app:assembleMobileDebug --no-daemon --max-workers=2
      - uses: actions/upload-artifact@v4
        with:
          name: CinemaHall-Next-TV-Mobile
          path: |
            android/cinemahall/app/build/outputs/apk/tv/debug/*.apk
            android/cinemahall/app/build/outputs/apk/mobile/debug/*.apk
